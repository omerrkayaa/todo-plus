name: Arayüzü GitHub Pages'e yayınla

# Elle çalıştırılır (Actions sekmesi → Run workflow). Önce repo ayarlarında
# Settings → Pages → Source: "GitHub Actions" seçilmelidir.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Yalnızca arayüz dosyalarını topla
        run: |
          mkdir site
          cp index.html styles.css manifest.webmanifest sw.js register-sw.js app*.js supabase-config.js site/
          cp -r vendor icons site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
